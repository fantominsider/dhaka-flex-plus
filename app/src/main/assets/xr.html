<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090e19"><title>Media Browser · XR Viewer</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{background:linear-gradient(145deg,#10182a,#060a12);color:#edf3ff;font-family:system-ui,-apple-system,sans-serif;margin:0;min-height:100vh;padding:18px}
main{max-width:920px;margin:0 auto}h1{font-size:clamp(23px,4vw,35px);margin:10px 0}h2{font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:12px 0}p{color:#c5d1ea;line-height:1.6}
#preview{display:block;width:100%;max-height:53vh;min-height:160px;background:#000;border:1px solid #354763;border-radius:18px;object-fit:contain}
.controls{display:flex;gap:9px;flex-wrap:wrap;margin:14px 0}button{background:#263854;color:white;border:1px solid #587ba9;border-radius:99px;min-height:48px;padding:12px 20px;font-size:15px;cursor:pointer}button.primary{background:#377cce;border-color:#65a8ff}button:disabled{opacity:.42;cursor:not-allowed}
.info{background:#19263c;border:1px solid #354763;border-radius:14px;padding:14px;margin-top:15px;font-size:13px;color:#c9d7f3}
#xr-canvas{position:fixed;inset:0;width:100%;height:100%;display:none;pointer-events:none}#status{margin:10px 0;min-height:1.5em}
</style>
</head>
<body>
<main id="panel"><h1>◉ Immersive Media Viewer</h1><h2 id="title">Loading media…</h2>
<p>Use the headset's immersive browser. Start the video, then enter VR. In immersive mode, a controller trigger toggles play/pause; use your headset's system control to exit VR.</p>
<video id="preview" controls playsinline preload="metadata" crossorigin="anonymous"></video>
<div class="controls"><button id="play" class="primary">▶ Play / Pause</button><button id="back">−30 sec</button><button id="next">+30 sec</button><button id="enter" class="primary" disabled>Enter VR theater</button><button id="exit" style="display:none">Exit VR</button></div>
<div id="status" role="status">Checking browser XR support…</div>
<div class="info" id="modeInfo"></div>
</main>
<canvas id="xr-canvas"></canvas>
<script src="/xr.js"></script>
</body>
</html>
